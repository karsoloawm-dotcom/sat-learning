<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dream Lantern | scene module preview</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#000;color:#eee;font:13px system-ui;overflow:hidden}
#stage{position:fixed;inset:0}#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
aside{position:fixed;left:10px;top:10px;width:330px;max-height:calc(100% - 70px);overflow:auto;background:#0b0e1ce6;padding:10px 12px;border-radius:6px;z-index:2}
aside.min{width:auto;max-height:none}aside.min .body{display:none}
select,button,input{font:inherit}ol{margin:6px 0;padding-left:22px}li{cursor:pointer;padding:1px 0}li.on{color:#ffcf7a}li small{color:#99a}
#bar{position:fixed;left:10px;right:10px;bottom:10px;display:flex;gap:8px;align-items:center;z-index:2;background:#0b0e1ce6;padding:6px 10px;border-radius:6px}
#bar input[type=range]{flex:1}#err{color:#ff8c8c;white-space:pre-wrap}#stats{font:12px ui-monospace,monospace;color:#bcd;white-space:pre}
#off{position:fixed;inset:0;display:none;place-items:center;color:#667;font:15px system-ui;pointer-events:none}
</style>
<div id="stage"><canvas id="gl"></canvas><canvas id="front"></canvas></div>
<div id="off">not on screen in this module · press N for its next shot</div>
<aside><b>Dream Lantern module</b> <button id="min">–</button>
<div class="body">
<label>module <select id="mod"></select></label> <label>tier <select id="tier"><option>saver</option><option selected>smooth</option><option>ultra</option></select></label>
<div><label><input type="checkbox" id="loop"> loop the current shot</label> <label><input type="checkbox" id="safe" checked> letterbox guide</label></div>
<div>song: <span id="song">silent beat clock</span> <input type="file" id="file" accept="audio/*" hidden><button id="pick">load…</button></div>
<ol id="list"></ol>
<button id="disp">dispose + leak check</button>
<div id="stats"></div><div id="err"></div>
</div></aside>
<div id="bar"><button id="play">⏸</button><span id="time">0.00</span><input type="range" id="scrub" min="0" max="126.78" step="0.001"><span id="beat"></span></div>
<script type="module">
/* Develop a scene module in isolation against the same frame object, layers and split layout the core uses.
   URL: module.html?m=sky&tier=smooth&t=7.5   Keys: space play/pause, N/P next/previous shot of this module, ←/→ one fast beat. */
import * as THREE from "three";
import { loadTiming, frameAt, lastIdx } from "../../assets/dream-lantern/timing.mjs";
import { createPipeline, createKit, lookFor } from "../../assets/dream-lantern/kit.mjs";
const BASE = new URL("../../assets/dream-lantern/", location.href).href, JSM = "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/";
const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
const [TM, SJ] = await Promise.all([loadTiming(BASE + "timing.json"), fetch(BASE + "shots.json").then(r => r.json())]);
const SHOTS = SJ.shots;
for (const m of ["_template", ...SJ.modules]) $("mod").add(new Option(m, m));
$("mod").value = Q.get("m") || SJ.modules[0]; $("tier").value = Q.get("tier") || "smooth";
const cvB = document.createElement("canvas"), cvG = $("gl"), cvF = $("front"), back2d = cvB.getContext("2d"), ctx2d = cvF.getContext("2d");
/* the same renderer set-up and dream-look pipeline as the core: the module renders into an HDR target, the post chain draws the screen */
const R = new THREE.WebGLRenderer({ canvas: cvG, antialias: false, powerPreference: "high-performance" });
R.outputColorSpace = THREE.SRGBColorSpace; R.toneMapping = THREE.NoToneMapping; R.setClearColor(0, 0); R.autoClear = false;
let pipe = null, KIT = null;
let W = 0, H = 0, dpr = 1, M = null, scene = null, camera = null, visible = false, err = "", playing = true, t = +(Q.get("t") || 0), lastP = performance.now(), audio = null, base0 = null, ms = 0;
/* which shots (and which split halves) this module draws; a module whose name starts with "_" (the template) draws them all */
let mine = [];
const own = m => SHOTS.map(s => s.mod === "split" ? ["L", "R"].filter(k => s[k].mod === m || m[0] === "_") : s.mod === m || (m[0] === "_" && s.mod !== "black" && s.mod !== "title") ? ["F"] : []);
function mod() { return $("mod").value }
function resize() {
  const tier = $("tier").value; dpr = Math.min(devicePixelRatio || 1, tier === "ultra" ? 2 : tier === "saver" ? 1 : 1.5);
  W = innerWidth; H = innerHeight; R.setPixelRatio(dpr); R.setSize(W, H, false);
  for (const c of [cvB, cvF]) { c.width = W * dpr | 0; c.height = H * dpr | 0 }
  if (pipe && pipe.tier !== tier) { pipe.dispose(); pipe = null }
  if (!pipe) { pipe = createPipeline(THREE, R, tier); pipe.tier = tier }
  pipe.resize(W, H);
}
addEventListener("resize", resize); resize();
function fail(where, e) { err = where + ": " + (e && e.stack || e); $("err").textContent = err; console.error(e) }
async function load() {
  if (M) { try { M.dispose() } catch (e) { fail("dispose", e) } }
  if (KIT) KIT.dispose();
  M = null; KIT = createKit(THREE, $("tier").value); err = ""; $("err").textContent = ""; visible = false; mine = own(mod());
  pipe.begin(); pipe.end(cvB, 0, [{ look: lookFor("intro"), x0: 0, x1: 1 }]); /* upload the pipeline's own resources before the baseline */
  R.renderLists.dispose(); base0 = { g: R.info.memory.geometries, x: R.info.memory.textures };
  scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(50, W / H, .1, 3000);
  history.replaceState(null, "", `?m=${mod()}&tier=${$("tier").value}&t=${t.toFixed(2)}`);
  try {
    const lib = await import(BASE + "scenes/" + mod() + ".mjs?v=" + Date.now());
    const t0 = performance.now();
    M = await lib.create({ THREE, scene, camera, ctx2d, back2d, renderer: R, kit: KIT, tier: $("tier").value, seed: 1, timing: TM, base: BASE, jsm: JSM });
    R.setRenderTarget(pipe.target); R.compile(scene, camera); R.setRenderTarget(null);
    $("err").textContent = `create ${(performance.now() - t0).toFixed(0)} ms`;
  } catch (e) { fail("create", e) }
  list();
}
function list() {
  const ol = $("list"); ol.innerHTML = "";
  SHOTS.forEach((s, i) => mine[i].forEach(side => {
    const p = side === "F" ? s : s[side], li = document.createElement("li");
    li.innerHTML = `${p.key}${p.var ? ":" + p.var : ""}${side !== "F" ? " (" + side + " half)" : ""} <small>#${i + 1} ${s.t.toFixed(2)}s ${(s.t1 - s.t).toFixed(2)}s ${s.tin}</small>`;
    li.title = s.note; li.dataset.i = i; li.onclick = () => seek(s.t + .001); ol.appendChild(li);
  }));
}
const shotAt = t => { let k = 0; for (let i = 0; i < SHOTS.length; i++) if (SHOTS[i].t <= t) k = i; return k };
function jump(d) { const i = shotAt(t); for (let k = i + d; k >= 0 && k < SHOTS.length; k += d) if (mine[k].length) return seek(SHOTS[k].t + .001) }
function seek(x) { t = Math.max(0, Math.min(TM.duration, x)); if (audio) audio.currentTime = t }
function viewports(s) { /* the core's split layout: halves meet at the centre; the seam may move in the real film, so do not rely on a 50 % width */
  return s.mod === "split" ? { L: [0, 0, W / 2 | 0, H], R: [W / 2 | 0, 0, W - (W / 2 | 0), H] } : { F: [0, 0, W, H] };
}
function frame() {
  requestAnimationFrame(frame);
  const pn = performance.now(), dt = Math.min(.1, (pn - lastP) / 1000); lastP = pn;
  if (audio && !audio.paused) t = audio.currentTime; else if (playing) t += dt;
  const i = shotAt(t), s = SHOTS[i];
  if ($("loop").checked && playing && mine[i].length && t >= s.t1 - .02) seek(s.t + .001);
  if (t > TM.duration) seek(0);
  $("scrub").value = t; $("time").textContent = t.toFixed(2) + "s";
  document.querySelectorAll("#list li").forEach(li => li.classList.toggle("on", +li.dataset.i === i));
  const base = frameAt(TM, t, dt), sides = mine[i], vps = viewports(s), k = dpr;
  $("beat").textContent = `${base.section} · bar ${Math.floor(base.bar)} · beat ${Math.floor(base.beat)} · #${i + 1} ${s.mod}`;
  back2d.setTransform(1, 0, 0, 1, 0, 0); back2d.clearRect(0, 0, cvB.width, cvB.height);
  ctx2d.setTransform(1, 0, 0, 1, 0, 0); ctx2d.clearRect(0, 0, cvF.width, cvF.height);
  pipe.begin();
  $("off").style.display = sides.length ? "none" : "grid";
  const on = !!(M && sides.length && !err);
  if (M && on !== visible) { try { M.setVisible(on) } catch (e) { fail("setVisible", e) } visible = on }
  let calls = 0, tris = 0, t0 = performance.now();
  if (on) for (const side of sides) {
    const p = side === "F" ? s : s[side], vp = vps[side];
    const f = Object.assign({}, base, { debug: true, tier: $("tier").value, W: vp[2] * k | 0, H: vp[3] * k | 0, dpr: k,
      shot: { i, key: p.key, var: p.var || "", t0: s.t, t1: s.t1, lt: t - s.t, u: Math.min(1, (t - s.t) / (s.t1 - s.t)), side, tin: s.tin, layer: s.layer, sec: s.sec } });
    for (const g of [back2d, ctx2d]) { g.save(); g.beginPath(); g.rect(vp[0] * k, vp[1] * k, vp[2] * k, vp[3] * k); g.clip(); g.translate(vp[0] * k, vp[1] * k) }
    camera.aspect = vp[2] / vp[3];
    try { M.update(f) } catch (e) { fail("update", e) }
    camera.updateProjectionMatrix();
    back2d.restore(); ctx2d.restore();
    pipe.part(scene, camera, vp, null, KIT.takeLook(base.section)); calls += R.info.render.calls; tris += R.info.render.triangles;
  }
  pipe.end(cvB, t, on ? null : [{ look: lookFor(base.section), x0: 0, x1: 1 }]);
  ms = ms * .9 + (performance.now() - t0) * .1;
  if (on && $("safe").checked) { ctx2d.strokeStyle = "#ff0a"; ctx2d.lineWidth = 1; const lb = cvF.height * .085; ctx2d.strokeRect(0, lb, cvF.width, cvF.height - 2 * lb) }
  $("stats").textContent = `update+render+post ${ms.toFixed(1)} ms   fps ${(1 / Math.max(dt, 1e-3)).toFixed(0)}\ncalls ${calls}   tris ${tris}\ngeometries ${R.info.memory.geometries}   textures ${R.info.memory.textures}\nprograms ${(R.info.programs || []).length}   canvas ${cvF.width}×${cvF.height}`;
}
$("mod").onchange = $("tier").onchange = () => { resize(); load() };
$("min").onclick = () => document.querySelector("aside").classList.toggle("min");
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸" : "▶"; if (audio) playing ? audio.play() : audio.pause() };
$("scrub").oninput = e => seek(+e.target.value);
$("pick").onclick = () => $("file").click();
$("file").onchange = () => { const f = $("file").files[0]; if (f) useAudio(URL.createObjectURL(f), f.name) };
function useAudio(url, label) { if (audio) audio.pause(); audio = new Audio(url); audio.currentTime = t; $("song").textContent = label; if (playing) audio.play().catch(() => { playing = false; $("play").textContent = "▶" }) }
$("disp").onclick = () => {
  if (!M) return; try { M.dispose() } catch (e) { fail("dispose", e) } KIT.dispose(); M = null; visible = false;
  R.renderLists.dispose(); R.render(scene, camera);
  const left = []; scene.traverse(o => { if (o !== scene) left.push(o.type + (o.name ? " " + o.name : "")) });
  const g = R.info.memory.geometries - base0.g, x = R.info.memory.textures - base0.x;
  $("err").textContent = `after dispose: ${g} geometries, ${x} textures still on the GPU; ${left.length} objects left in the scene${left.length ? " (" + left.slice(0, 6).join(", ") + ")" : ""}${g || x ? "  ← leak" : "  ✓"}`;
};
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  if (e.key === " ") { e.preventDefault(); $("play").click() }
  else if (e.key === "n" || e.key === "N") jump(1); else if (e.key === "p" || e.key === "P") jump(-1);
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { e.preventDefault(); const j = lastIdx(TM.fast, t) + (e.key === "ArrowRight" ? 1 : -1); seek(TM.fast[Math.max(0, j)] + .001) }
});
if (/^(localhost|127\.|\[::1\])/.test(location.hostname)) for (const ext of ["m4a", "mp3", "ogg", "wav"]) {
  const r = await fetch(BASE + "../local/dream-lantern." + ext, { method: "HEAD", cache: "no-store" }).catch(() => null);
  if (r && r.ok) { useAudio(URL.createObjectURL(await (await fetch(BASE + "../local/dream-lantern." + ext)).blob()), "local file"); break }
}
await load();
if (!Q.get("t")) jump(1);
requestAnimationFrame(frame);
</script>
